name: Build Portable Releases

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\release\runner\* -DestinationPath dev_tools_windows_portable.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev_tools_windows_portable
          path: dev_tools_windows_portable.zip

  build-linux:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Compress Linux Archive
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../dev_tools_linux_portable.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev_tools_linux_portable
          path: dev_tools_linux_portable.tar.gz
