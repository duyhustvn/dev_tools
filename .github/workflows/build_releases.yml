name: Build Portable Releases

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Compress Release Archive
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build -Filter "dev_tools_pro_max.exe" -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $releaseDir) {
            Write-Error "Could not find dev_tools_pro_max.exe in build folder"
            exit 1
          }
          Write-Output "Found release directory: $releaseDir"
          Copy-Item -Path README.md -Destination "$releaseDir\README.txt"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath dev_tools_windows_portable.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev_tools_windows_portable
          path: dev_tools_windows_portable.zip

  build-linux:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Prepare Linux Bundle Assets
        run: |
          cp icons/icon.png build/linux/x64/release/bundle/icon.png
          cp setup.sh build/linux/x64/release/bundle/setup.sh
          chmod +x build/linux/x64/release/bundle/setup.sh
          cp README.md build/linux/x64/release/bundle/README.md

      - name: Compress Linux Archive
        run: |
          tar -czvf dev_tools_linux_portable.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev_tools_linux_portable
          path: dev_tools_linux_portable.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: dev_tools_windows_portable
          path: ./

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: dev_tools_linux_portable
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dev_tools_windows_portable.zip
            dev_tools_linux_portable.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
